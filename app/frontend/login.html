<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090502" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cipher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Tela propria, sem o shell do chat. Reusa as variaveis do style.css para o
       tema acompanhar sozinho qualquer mudanca de paleta. */
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }

    .acesso {
      position: relative; z-index: 1;
      width: 100%; max-width: 380px;
      display: flex; flex-direction: column; align-items: center; gap: 22px;
      text-align: center;
    }

    /* O nucleo aqui e estatico e pequeno: a tela de login nao justifica carregar
       a cena animada inteira, e quem chega aqui esta a um passo de ver a de
       verdade. */
    .acesso-nucleo { width: 96px; height: 96px; filter: drop-shadow(0 0 24px rgba(255,138,31,0.35)); }

    .acesso-marca {
      font-family: var(--font-hud); font-size: 21px; font-weight: 700;
      letter-spacing: 7px; color: var(--p); line-height: 1;
      text-shadow: 0 0 20px rgba(255,138,31,0.5);
    }
    .acesso-sub { font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; color: var(--text3); }

    .acesso-form { display: flex; flex-direction: column; gap: 12px; width: 100%; }

    .acesso-campo {
      width: 100%; padding: 13px 15px;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--r);
      font-family: var(--font-body); font-size: 16px;
      transition: border-color var(--t), box-shadow var(--t);
    }
    .acesso-campo::placeholder { color: var(--text3); }
    .acesso-campo:focus {
      outline: none; border-color: var(--p35);
      box-shadow: 0 0 0 3px rgba(255,138,31,0.10);
    }

    .acesso-btn {
      width: 100%; padding: 13px;
      background: var(--p); color: #140803;
      border: none; border-radius: var(--r);
      font-family: var(--font-hud); font-size: 14px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
      transition: filter var(--t), transform var(--t);
    }
    .acesso-btn:hover:not(:disabled) { filter: brightness(1.12); }
    .acesso-btn:active:not(:disabled) { transform: scale3d(0.98, 0.98, 1); }
    .acesso-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .acesso-erro {
      min-height: 18px;
      font-family: var(--font-mono); font-size: 12px; color: var(--danger);
    }
  </style>
</head>
<body>

  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-radial" aria-hidden="true"></div>

  <main class="acesso">
    <svg class="acesso-nucleo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="anel" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#C2410C"/>
          <stop offset="50%" stop-color="#FFD9A8"/>
          <stop offset="100%" stop-color="#C2410C"/>
        </linearGradient>
      </defs>
      <ellipse cx="16" cy="16" rx="14" ry="5.6" fill="none" stroke="#B0480F" stroke-width="0.8" opacity="0.75"/>
      <ellipse cx="16" cy="16" rx="11.4" ry="4.5" fill="none" stroke="url(#anel)" stroke-width="1.5" opacity="0.95"/>
      <circle cx="16" cy="16" r="4.5" fill="#FFE0B8"/>
      <circle cx="16" cy="16" r="3.7" fill="#070301"/>
      <path d="M 4.6 16 A 11.4 4.5 0 0 0 27.4 16" fill="none" stroke="url(#anel)" stroke-width="1.5" opacity="0.95"/>
    </svg>

    <div>
      <div class="acesso-marca">Cipher</div>
      <div class="acesso-sub">ACESSO RESTRITO</div>
    </div>

    <form class="acesso-form" id="form-acesso" autocomplete="on">
      <input
        class="acesso-campo"
        type="password"
        id="senha"
        name="password"
        placeholder="Senha"
        autocomplete="current-password"
        required
        autofocus
      />
      <button class="acesso-btn" type="submit" id="btn-entrar">Entrar</button>
      <p class="acesso-erro" id="erro" role="alert" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("form-acesso");
    const campo = document.getElementById("senha");
    const btn = document.getElementById("btn-entrar");
    const erro = document.getElementById("erro");

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      erro.textContent = "";
      btn.disabled = true;
      btn.textContent = "Verificando";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ senha: campo.value }),
        });
        const dados = await res.json().catch(() => ({}));

        if (res.ok) {
          // `replace` e nao `href`: evita que o botao voltar do navegador
          // retorne para a tela de login depois de autenticado.
          window.location.replace("/");
          return;
        }
        erro.textContent = dados.error || "Nao foi possivel entrar.";
      } catch (_) {
        erro.textContent = "Sem resposta do servidor.";
      }

      btn.disabled = false;
      btn.textContent = "Entrar";
      campo.select();
    });
  </script>
</body>
</html>
